name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.62.2
      - run: npm run build
      - name: Prevent the retired Damas domain from being republished
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          for (const path of ['public/CNAME', 'docs/CNAME', 'dist/CNAME']) {
            if (existsSync(path) && /^(?:www\.)?damascenerose\.com\.?$/im.test(readFileSync(path, 'utf8').trim())) {
              throw new Error(`${path} claims the Damas domain, which belongs to mdo91/damascene-rose-web after transfer.`);
            }
          }
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
